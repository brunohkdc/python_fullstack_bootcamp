{% load django_vite %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Home
        </title>

        {% vite_hmr_client %}
        {% vite_asset 'static/js/app.js' %}

    </head>
    <body>

        <div class="max-w-md mx-auto mt-10 bg-base-200 p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-4">Change Password</h2>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Old Password</span>
                    </label>
                    <input type="password" name="old_password" class="input input-bordered w-full" required>
                    {{ form.old_password.errors }}
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">New Password</span>
                    </label>
                    <input type="password" name="new_password1" class="input input-bordered w-full" required>
                    {{ form.new_password1.errors }}
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Confirm New Password</span>
                    </label>
                    <input type="password" name="new_password2" class="input input-bordered w-full" required>
                    {{ form.new_password2.errors }}
                </div>

                <div class="form-control mt-4">
                    <button type="submit" class="btn btn-primary w-full">Update Password</button>
                </div>
            </form>

            <div class="divider"></div>
            <div class="text-center">
                <a href="{% url 'my_posts' %}" class="link link-primary">Back to Dashboard</a>
            </div>
        </div>




    </body>
</html>
